name: SME Python tools validation

on:
  push:
    branches:
      - fixes-budget-rebuild-validation-20261019
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
