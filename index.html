<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102f33">
<meta name="description" content="Gestión del taller Servicios Mecánicos Enzo">
<link rel="manifest" href="manifest.json">
<title>SME</title>
<style>
@media print{
 header,nav,.no-print,form,label[for],#searchRecords,.quick{display:none!important}
 body{background:#fff;color:#222}
 main{max-width:none;padding:0;background:none!important}
 .item,.panel{background:#fff;color:#222;box-shadow:none;border:1px solid #bbb;break-inside:avoid}
 .section-title{margin-top:0;color:#222}
}
:root{
 --petrol:#102f33;--petrol2:#1c4548;--ochre:#c6a16a;
 --paper:#1b211f;--ink:#eee4d1;--muted:#bdb29e;--line:#5a5549;--white:#282c27;
 --walnut:#35271f;--rust:#a64f2a;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#29312e 0,#1b211f 48%,#211a16 100%);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
/* Cabecera vintage: madera azul petróleo envejecida, con vetas discretas y latón apagado. */
header{background-color:#102d31;background-image:
 linear-gradient(180deg,rgba(7,17,18,.36),rgba(7,17,18,.08) 42%,rgba(5,14,15,.4)),
 repeating-linear-gradient(177deg,transparent 0 8px,rgba(3,13,15,.42) 9px 11px,rgba(37,72,73,.22) 12px 14px,transparent 15px 24px),
 repeating-linear-gradient(2deg,rgba(4,17,19,.22) 0 2px,transparent 3px 13px,rgba(133,91,48,.13) 14px 15px,transparent 16px 29px),
 linear-gradient(110deg,#0b2429 0%,#15383d 48%,#102b30 100%);
 color:var(--ink);padding:14px 16px 13px;border-bottom:3px solid #a98a58;box-shadow:0 5px 18px #0005}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;gap:13px}
.brand-logo{width:122px;height:70px;object-fit:contain;flex:0 0 auto;filter:saturate(.68) brightness(.92) contrast(.96) drop-shadow(0 2px 2px #0009)}
.header-copy{min-width:0;flex:1}
.brand{font-size:11px;letter-spacing:2px;color:#d9bb85;text-transform:uppercase}
.title{font-family:Georgia,serif;font-size:clamp(20px,4vw,29px);line-height:1.12;margin:5px 0;color:#f2e7d1}
.subtitle{font-family:Georgia,serif;font-size:13px;font-style:italic;color:#d7c5a4}
main{max-width:900px;margin:auto;padding:18px 14px 100px;background-image:url('./logo-watermark.svg');background-repeat:no-repeat;background-position:center 150px;background-size:min(94%,620px) auto}
.section-title{font-family:Georgia,serif;font-size:23px;margin:8px 0 14px;color:#e5c58f}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile,.panel{background:rgba(39,43,38,.94);border:1px solid #514a3e;border-radius:13px;padding:16px;box-shadow:0 4px 14px #0002}
.tile{min-height:104px;text-align:left;color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ochre);transform:translateY(-1px)}
.tile-icon{display:flex;align-items:center;height:46px;color:#c6a16a;margin-bottom:3px}.tile-icon .line-icon{width:40px;height:40px;stroke-width:1.35}.line-icon{display:inline-block;vertical-align:middle;flex-shrink:0}.tile strong{display:block;margin-top:5px;color:#ead5ad}.tile small{color:var(--muted)}
.panel{margin-top:14px}
.dashboard-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.dashboard-stat{min-height:122px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;background:rgba(39,43,38,.96);border:1px solid #514a3e;border-radius:13px;padding:14px;color:var(--ink);text-align:left}
.dashboard-stat .stat-icon{display:flex;align-items:center;color:#c6a16a;height:34px}.dashboard-stat .stat-icon svg{width:29px;height:29px;stroke-width:1.7}
.dashboard-stat .stat-value{font-family:Georgia,serif;font-size:29px;font-weight:700;color:#e5c58f;line-height:1.05}
.dashboard-stat .stat-label{font-size:13px;color:var(--muted)}
.dashboard-columns{display:grid;grid-template-columns:1fr;gap:12px}
.dashboard-panel h3,.more-section-title{font-family:Georgia,serif;font-size:19px;color:#e5c58f;margin:0 0 11px}
.dashboard-entry{padding:10px 0;border-top:1px solid #49463d}
.dashboard-entry:first-of-type{border-top:0;padding-top:0}
.dashboard-entry strong{display:block;color:#ead5ad}
.dashboard-entry small{display:block;color:var(--muted);margin-top:3px;line-height:1.45}
.dashboard-empty{padding:12px 0;color:var(--muted);font-size:14px}
.more-group{margin-top:20px}
.more-group:first-of-type{margin-top:12px}
.more-section-title{margin-bottom:4px}
.more-section-subtitle{font-size:13px;color:var(--muted);margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
#smeBackExitPrompt{position:fixed;z-index:10000;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:12px 18px;border:1px solid #c6a16a;border-radius:999px;background:#102f33;color:#f2e7d1;box-shadow:0 6px 22px #0008;font-size:14px;text-align:center}
#smeBackExitPrompt[hidden]{display:none!important}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.btn{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:9px;padding:11px 14px;background:var(--petrol2);color:#f4ead8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.secondary{background:#d9c9a9;color:#26302c;border-color:#bda982}
.accent{background:var(--ochre);color:#211b13;border-color:#e1bf82}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,38,40,.97);border-top:1px solid #6a5a40;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -5px 16px #0003;backdrop-filter:blur(8px)}
nav button{background:transparent;color:#bcb19b;padding:6px 4px;font-size:11px;min-width:0;flex:1;border:0}
nav button.active{color:#e0bc7b;font-weight:750}
nav .nav-symbol{display:flex;align-items:center;justify-content:center;height:30px;margin-bottom:2px}nav .nav-symbol svg{display:block;width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* Campos de formulario: gris azulado petróleo, en armonía con la identidad oscura de SME. */
input,select,textarea{width:100%;font:inherit;border:1px solid #687775;border-radius:9px;padding:12px;background:#29383a;margin-top:5px;color:#eee4d1;color-scheme:dark}
input::placeholder,textarea::placeholder{color:#b4bdb8}
input:focus,select:focus,textarea:focus{border-color:#c6a16a;background:#2d3e40}
/* Teclado móvil: reservar espacio y mantener visible el campo enfocado. */
html{scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.sme-keyboard-open nav{display:none!important}
body.sme-keyboard-open main{padding-bottom:calc(55vh + 44px + env(safe-area-inset-bottom))}
body.sme-keyboard-open{scroll-padding-bottom:55vh}
input,select,textarea,button{scroll-margin-top:18px;scroll-margin-bottom:24px}
form [data-form-error]:empty{display:none}
form [data-form-error]:not(:empty){display:block;padding:9px 10px;border:1px solid #a86b60;border-radius:8px;background:#3b2825}
button:disabled{opacity:.65;cursor:wait}

select option{background:#29383a;color:#eee4d1}
input[type=checkbox]{-webkit-appearance:auto!important;appearance:auto!important;color-scheme:dark!important;accent-color:#c6a16a!important;width:20px!important;height:20px!important;min-width:20px!important;flex:0 0 20px;padding:0!important;margin:1px 6px 0 0!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;box-shadow:none!important;vertical-align:middle;cursor:pointer}
input[type=checkbox]:focus-visible{outline:2px solid #e5c58f;outline-offset:2px}
.checkbox-grid{display:grid;grid-template-columns:1fr;gap:5px;margin:8px 0}
.checkbox-grid label{display:flex;align-items:flex-start;gap:4px;font-weight:500;margin:5px 0;position:relative;padding-left:30px;min-height:24px}
.checkbox-grid label input[type=checkbox]{position:absolute!important;left:0;top:0;opacity:0!important;width:24px!important;height:24px!important;margin:0!important;padding:0!important;z-index:2;cursor:pointer}
.checkbox-grid label::before{content:"";position:absolute;left:0;top:0;width:21px;height:21px;box-sizing:border-box;border:2px solid #c6a16a;border-radius:5px;background:#1b211f}
.checkbox-grid label:has(input[type=checkbox]:checked)::before{background:#c6a16a;border-color:#e5c58f}
.checkbox-grid label:has(input[type=checkbox]:checked)::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:4px;border-left:2px solid #24302b;border-bottom:2px solid #24302b;transform:rotate(-45deg);z-index:1}
.checkbox-grid label:focus-within::before{outline:2px solid #e5c58f;outline-offset:2px}
.checkbox-grid input{flex:0 0 auto;margin-top:3px}
label{display:block;font-size:13px;font-weight:650;margin:12px 0;color:#e0d4bd}
form button{margin-top:10px;width:100%}
.list{display:grid;gap:9px;margin-top:14px}
.item{padding:12px;border:1px solid #514a3e;border-radius:10px;background:rgba(39,43,38,.96);color:var(--ink)}
.item strong{display:block;color:#ead5ad}
.empty{padding:22px;text-align:center;color:var(--muted)}
.diag-report{margin:12px 0 4px;padding:12px;border:1px solid #565144;border-radius:10px;background:rgba(14,29,28,.35)}.diag-report h3{margin:0 0 10px;color:#e5c58f}.diag-report h4{margin:12px 0 6px;color:#e3cfaa}.diag-report-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0}.diag-report-stats span{display:block;border:1px solid #595448;border-radius:7px;padding:7px;font-size:13px}.diag-report-stats b{font-size:17px;margin-right:4px;color:#f0d6a8}.diag-report-note{font-size:12px;color:var(--muted)}.diag-priority{border-left:3px solid #bba575;padding:8px 10px;margin:9px 0;background:rgba(0,0,0,.12);border-radius:4px}.diag-priority-urgente{border-left-color:#ce6b5f}.diag-priority-alta{border-left-color:#d6a24b}.diag-priority-preventiva{border-left-color:#719a9b}.diag-priority ul,.diag-compact-findings{margin:5px 0;padding-left:20px}.diag-priority li,.diag-compact-findings li{margin:6px 0}.diag-priority li div{font-size:13px;color:var(--muted)}.diag-report p{white-space:pre-wrap}
.debt-overdue{color:#ff9e91;font-weight:700}.item details summary{cursor:pointer;color:#d8bd8b}.item details{margin:8px 0}.item form[hidden]{display:none!important}.item form.panel{margin-top:10px;background:rgba(10,20,20,.35)}
@media(min-width:620px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard-stats{grid-template-columns:repeat(4,minmax(0,1fr))}.dashboard-columns{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:32px}.brand-logo{width:145px;height:78px}}

@media(max-width:370px){header{padding:12px 10px}.header-inner{gap:8px}.brand-logo{width:92px;height:58px}.title{font-size:19px}.subtitle{font-size:12px}main{padding-left:10px;padding-right:10px}.tile{padding:12px}}

.related-actions{margin:9px 0 0;padding-top:8px;border-top:1px solid #49463d}.related-actions button{font-size:12px;padding:8px 10px}

.sme-faatra-reference{border-color:#806b49;background:rgba(31,44,40,.93)}
.sme-faatra-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}

.sme-faatra-source-tag{font-size:10px;letter-spacing:.8px;color:#e5c58f;border:1px solid #806b49;border-radius:999px;padding:4px 8px;white-space:nowrap}
.sme-faatra-rate{display:flex;flex-direction:column;gap:3px;margin:12px 0;padding:12px;border-radius:10px;background:rgba(10,25,25,.42);border:1px solid #5a5549}
.sme-faatra-rate span,.sme-faatra-rate small{color:var(--muted);font-size:12px}
.sme-faatra-rate strong{font:700 clamp(24px,5vw,30px)/1.2 Georgia,serif;color:#e5c58f}
.sme-faatra-warning{border-left:3px solid #d69a56;padding:9px 11px;background:rgba(116,69,34,.18);border-radius:5px;font-size:13px;line-height:1.45}

.sme-faatra-update-notice p{margin:7px 0 0;line-height:1.5;font-size:13px}
.sme-faatra-notice-copy{min-width:0}

/* Inicio SME: jerarquía visual, asimetría útil y calma. */

.home-feature{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;margin:12px 0 16px;padding:19px;border-radius:15px;border:1px solid #92744c;background:linear-gradient(135deg,#273b38,#182725 76%);color:#f0e4ce;min-height:145px}.home-feature-kicker{font-size:10px;letter-spacing:1.4px;color:#e2bd7a;font-weight:750;margin-bottom:10px}.home-feature strong{font:600 23px/1.2 Georgia,serif;overflow-wrap:anywhere}.home-feature-meta{font-size:13px;color:#d2c7b3;margin-top:7px}.home-feature-action{font-size:13px;font-weight:700;color:#e2bd7a;margin-top:17px}.home-feature-action b{font-size:18px}
.home-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.9fr);gap:12px;align-items:start}.home-widget{min-width:0;margin:0 0 12px;padding:14px;border:1px solid #49463d;border-radius:13px;background:rgba(39,43,38,.58)}.home-widget-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.home-widget-heading h3{font:600 18px/1.2 Georgia,serif;color:#e5c58f;margin:0}.home-widget-heading svg{color:#c6a16a}.home-task{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 0;background:transparent;border:0;border-top:1px solid #49463d;border-radius:0;color:var(--ink)}.home-task:first-of-type{border-top:0}.home-task-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#a6a18f}.home-task-dot.is-priority{background:#d59b59;box-shadow:0 0 0 3px #d59b5920}.home-task-copy{min-width:0;flex:1}.home-task-copy strong{display:block;font-size:14px;overflow-wrap:anywhere}.home-task-copy small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.home-chevron{font-size:24px;color:#b5a27f}.home-quiet{font-size:13px;line-height:1.5;color:var(--muted);padding:4px 0 8px}.home-link{display:inline-flex;gap:7px;background:transparent;color:#dfbd83;border:0;padding:8px 0 0;font-size:12px;font-weight:700}.home-notice{padding:8px 0;border-top:1px solid #49463d}.home-notice strong{display:block;font-size:13px}.home-notice small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.home-notice-button{display:block;width:100%;border-left:0;border-right:0;border-bottom:0;border-radius:0;background:transparent;text-align:left;color:var(--ink)}.home-notice-button:first-of-type{border-top:0}.home-notice-state{color:#dfbd83!important;font-weight:650}.home-quick{margin-top:8px;padding:12px 0 0}.home-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.home-quick-grid button{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:82px;padding:12px;background:rgba(39,43,38,.68);border:1px solid #49463d;color:#e8d8bb;text-align:left;font-size:12px}.home-quick-grid button svg{color:#c6a16a}

.home-metrics{gap:7px;margin-bottom:10px}.home-overview{margin:10px 0 12px}.home-metrics .dashboard-stat{min-height:68px;padding:8px 9px}.home-metrics .dashboard-stat .stat-icon{height:19px}.home-metrics .dashboard-stat .stat-icon svg{width:18px;height:18px}.home-metrics .dashboard-stat .stat-value{font-size:20px}.home-metrics .dashboard-stat .stat-label{font-size:10px}

<script type="module">
import { openSMEStorage } from './src/storage/sqlite-store.js';
import { Filesystem, Directory, Encoding } from '@capacitor/filesystem';
import { Printer } from '@capgo/capacitor-printer';
import { Share } from '@capacitor/share';
import { Capacitor, registerPlugin } from '@capacitor/core';
const SmeBackup=registerPlugin('SmeBackup');
import { App as CapacitorApp } from '@capacitor/app';
import { BiometricAuth, AndroidBiometryStrength } from '@aparajita/capacitor-biometric-auth';
const KEY='sme_taller_v1';
const emptyDB=()=>({clientes:[],vehiculos:[],trabajos:[],presupuestos:[],movimientos:[],eventos:[],recepciones:[],diagnosticos:[],cuentas:[],asistencias:[],terceros:[],trabajosExternos:[],configHorarios:[],tareas:[],avisos:[],solicitudesGasto:[]});
let storage,db;
try {
  storage=await openSMEStorage(KEY);
  db=await storage.load(emptyDB);
} catch(error) {
  console.error('Error de almacenamiento SME:',error);
  const root=document.getElementById('app');
  if(root) {
    root.innerHTML='<div class="panel"><h2>No se pudo abrir el almacenamiento</h2><p>Por seguridad, la app no continuará para evitar guardar datos en un lugar incorrecto. Conservá tu respaldo y no borres datos.</p><p><strong>Detalle técnico:</strong> <code id="storageErrorDetail"></code></p></div>';
    const detail=document.getElementById('storageErrorDetail');
    if(detail) detail.textContent=String(error?.message||error||'Error sin detalle');
  }
  throw error;
}
for(const k of Object.keys(emptyDB()))if(!Array.isArray(db[k]))db[k]=[];

/*
 * Respaldos locales versionados. Este disparador se ejecuta al abrir SME:
 * no sustituye un trabajador nativo Android, porque JavaScript no se ejecuta
 * de forma garantizada cuando la aplicación está cerrada.
 */
const SME_BACKUP_DAILY_PREFIX='SME-automatico-diario-';
const SME_BACKUP_MONTHLY_PREFIX='SME-historico-mensual-';
const SME_BACKUP_RETENTION_DAYS=7;
const SME_BACKUP_RETENTION_MONTHS=60;
function smeBackupDateKey(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function smeBackupMonthKey(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')}
function smeValidateBackupSnapshot(snapshot){
 const keys=Object.keys(emptyDB());
 if(!snapshot||typeof snapshot!=='object'||Array.isArray(snapshot))throw new Error('El respaldo no contiene un objeto de datos válido.');
 for(const key of keys){
  if(!Array.isArray(snapshot[key]))throw new Error('La sección '+key+' no es una lista válida.');
  const ids=new Set();
  for(const record of snapshot[key]){
   if(!record||typeof record!=='object'||Array.isArray(record)||record.id===undefined||record.id===null||String(record.id).trim()==='')throw new Error('Registro sin identificador en '+key+'.');
   const id=String(record.id);if(ids.has(id))throw new Error('Identificador duplicado '+id+' en '+key+'.');ids.add(id);
  }
 }
 const serialized=JSON.stringify(snapshot);
 if(!serialized||!JSON.parse(serialized))throw new Error('No se pudo verificar el contenido serializado.');
 return serialized;
}
async function smePruneAutomaticBackups(prefix,keepCount){
 try{
  const listing=await Filesystem.readdir({path:'',directory:Directory.Documents});
  const names=(listing.files||[]).map(item=>typeof item==='string'?item:item.name).filter(name=>name&&name.startsWith(prefix)&&name.endsWith('.json')).sort();
  const remove=names.slice(0,Math.max(0,names.length-keepCount));
  for(const name of remove){try{await Filesystem.deleteFile({path:name,directory:Directory.Documents})}catch(error){console.warn('No se pudo depurar el respaldo antiguo '+name,error)}}
 }catch(error){console.warn('No se pudo revisar la retención de respaldos SME:',error)}
}
async function smeRunAutomaticBackups(){
 if(!storage?.isNative||!smeAuthenticated||!smeCurrentUser)return;
 try{
  const now=new Date(),dailyName=SME_BACKUP_DAILY_PREFIX+smeBackupDateKey(now)+'.json';
  const monthName=SME_BACKUP_MONTHLY_PREFIX+smeBackupMonthKey(now)+'.json';
  const listing=await Filesystem.readdir({path:'',directory:Directory.Documents});
  const existing=new Set((listing.files||[]).map(item=>typeof item==='string'?item:item.name));
  const writeVerified=async name=>{
   const serialized=smeValidateBackupSnapshot(smeCreatePortableBackup());
   await Filesystem.writeFile({path:name,data:serialized,directory:Directory.Documents,encoding:Encoding.UTF8});
   const readback=await Filesystem.readFile({path:name,directory:Directory.Documents,encoding:Encoding.UTF8});
   const restored=JSON.parse(typeof readback.data==='string'?readback.data:'');
   smeValidateBackupSnapshot(restored);
  };
  const ensurePortable=async name=>{
   if(!existing.has(name)){await writeVerified(name);return}
   // Upgrade older automatic snapshots that stored only workshop data, not account recovery information.
   const owner=smeOwnerAccount();
   const isOwner=!!(owner&&smeCurrentUser.isPrimary===true&&String(owner.id)===String(smeCurrentUser.id));
   if(!isOwner)return;
   try{
    const readback=await Filesystem.readFile({path:name,directory:Directory.Documents,encoding:Encoding.UTF8});
    const old=JSON.parse(typeof readback.data==='string'?readback.data:'');
    if(!old?._smeBackupMetadata?.ownerId)await writeVerified(name);
   }catch(error){console.warn('No se pudo verificar el respaldo automático existente:',error)}
  };
  await ensurePortable(dailyName);
  await ensurePortable(monthName);
  await smePruneAutomaticBackups(SME_BACKUP_DAILY_PREFIX,SME_BACKUP_RETENTION_DAYS);
  await smePruneAutomaticBackups(SME_BACKUP_MONTHLY_PREFIX,SME_BACKUP_RETENTION_MONTHS);
 }catch(error){console.error('No se pudo completar el respaldo automático local de SME:',error)}
}
function newRecordId(){return globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function'?globalThis.crypto.randomUUID():'sme-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);}
let page='inicio',editingId=null;
let smeRelatedFilter=null;
let exitBackPressedAt=0;
let exitBackPromptTimer=null;
let thirdPartyEditingId=null;
const app=document.getElementById('app');
function smeHideBackExitPrompt(){
 clearTimeout(exitBackPromptTimer);
 const prompt=document.getElementById('smeBackExitPrompt');
 if(prompt)prompt.hidden=true;
}
function smeResetNavigation(){
 exitBackPressedAt=0;
 smeHideBackExitPrompt();
}
const SME_RESUME_PAGE_KEY='sme_resume_page_v1';
const SME_FORM_DRAFT_PREFIX='sme_form_draft_v1:';
function smeRememberCurrentPage(){try{if(smeAuthenticated&&page&&page!=='inicio')localStorage.setItem(SME_RESUME_PAGE_KEY,page)}catch(error){console.warn('No se pudo recordar la pantalla SME:',error)}}
function smeGetResumePage(){
 try{const saved=localStorage.getItem(SME_RESUME_PAGE_KEY);return saved&&smeCan(saved,'view')?saved:'inicio'}catch(_){return 'inicio'}
}
function smeDraftKey(form){return SME_FORM_DRAFT_PREFIX+page+':'+(form.id||form.getAttribute('data-draft-key')||'form')}
function smeSaveFormDraft(form){
 if(!form||!form.querySelector('input,select,textarea')||form.closest('#smeAuthOverlay'))return;
 try{const values={};for(const el of form.elements){if(!el.name||el.type==='password'||el.type==='file'||el.type==='submit'||el.type==='button')continue;if(el.type==='checkbox'||el.type==='radio')values[el.name+'::'+(el.value||'on')]=el.checked;else values[el.name]=el.value}
 localStorage.setItem(smeDraftKey(form),JSON.stringify({savedAt:Date.now(),values}));
 }catch(error){console.warn('No se pudo guardar el borrador del formulario:',error)}
}
function smeRestoreFormDrafts(){
 const forms=[...document.querySelectorAll('#app form')];
 forms.forEach(form=>{try{const raw=localStorage.getItem(smeDraftKey(form));if(!raw)return;const draft=JSON.parse(raw);if(!draft||!draft.values)return;
 for(const el of form.elements){if(!el.name||el.type==='password'||el.type==='file'||el.type==='submit'||el.type==='button')continue;if(el.type==='checkbox'||el.type==='radio'){const k=el.name+'::'+(el.value||'on');if(Object.prototype.hasOwnProperty.call(draft.values,k))el.checked=!!draft.values[k]}else if(Object.prototype.hasOwnProperty.call(draft.values,el.name))el.value=draft.values[el.name]}
 const note=document.createElement('p');note.className='muted sme-draft-note';note.textContent='Borrador recuperado automáticamente. Revisá los datos antes de guardar.';form.prepend(note);
 }catch(error){console.warn('No se pudo recuperar un borrador SME:',error)}})
}
document.addEventListener('input',e=>{const form=e.target?.closest?.('#app form');if(form)smeSaveFormDraft(form)},true);
document.addEventListener('change',e=>{const form=e.target?.closest?.('#app form');if(form)smeSaveFormDraft(form)},true);

async function smeHandleHardwareBack(){
 if(page!=='inicio'){
  const parentPage=SME_BACK_PARENT_BY_PAGE[page]||'inicio';
  smeNavigateTo(parentPage);
  return;
 }
 const now=Date.now();
 if(exitBackPressedAt&&now-exitBackPressedAt<=2200){
  exitBackPressedAt=0;
  smeHideBackExitPrompt();
  try{
   await CapacitorApp.exitApp();
  }catch(error){
   console.error('No se pudo cerrar la aplicación desde el botón Atrás:',error);
  }
  return;
 }

}

function smeNow(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function smeM(v){if(!/^\d{2}:\d{2}$/.test(String(v||'')))return null;const a=String(v).split(':').map(Number);return a[0]*60+a[1]}
const SME_WEEKDAYS=[{key:'lunes',label:'Lunes',n:1},{key:'martes',label:'Martes',n:2},{key:'miercoles',label:'Miércoles',n:3},{key:'jueves',label:'Jueves',n:4},{key:'viernes',label:'Viernes',n:5},{key:'sabado',label:'Sábado',n:6},{key:'domingo',label:'Domingo',n:0}];
function smeCfg(id,date=todayLocal()){
 const stored=db.configHorarios.find(x=>String(x.userId)===String(id))||{userId:String(id),entrada:'08:00',salida:'17:00',inicioDescanso:'12:00',finDescanso:'13:00',toleranciaEntrada:15,toleranciaSalida:15,toleranciaDescanso:15};
 const base={entrada:'08:00',salida:'17:00',inicioDescanso:'12:00',finDescanso:'13:00',toleranciaEntrada:15,toleranciaSalida:15,toleranciaDescanso:15,...stored};
 const exception=(stored.excepciones||[]).find(x=>x.fecha===date);
 if(exception)return {...base,...exception};
 const dt=new Date(String(date||todayLocal())+'T12:00:00'),day=SME_WEEKDAYS.find(x=>x.n===dt.getDay());
 return day&&stored.horariosPorDia&&stored.horariosPorDia[day.key]?{...base,...stored.horariosPorDia[day.key]}:base;
}
function smeFlags(r,c){const f=[],a=smeM(r.entrada),ae=smeM(c.entrada),b=smeM(r.salida),be=smeM(c.salida);if(a!==null&&ae!==null&&a>ae+Number(c.toleranciaEntrada??15))f.push('Llegada tarde');if(a!==null&&ae!==null&&a<ae-Number(c.toleranciaEntrada??15))f.push('Entrada anticipada');if(b!==null&&be!==null&&b<be-Number(c.toleranciaSalida??15))f.push('Salida anticipada');if(r.entrada&&!r.salida)f.push('Falta registrar salida');if(r.descansoInicio&&!r.descansoFin)f.push('Descanso sin finalizar');if(r.salida&&b!==null&&be!==null&&b>be+Number(c.toleranciaSalida??15))f.push('Posibles horas extra: revisar');return f}

 const punch=async field=>{const before=JSON.stringify(db);let r=db.asistencias.find(x=>String(x.userId)===String(u.id)&&x.fecha===today);if(!r){r={id:newRecordId(),userId:String(u.id),userName:u.name||u.username,fecha:today,entrada:'',salida:'',descansoInicio:'',descansoFin:'',correcciones:[]};db.asistencias.push(r)}if(field==='entrada'){if(r.entrada)return;r.entrada=smeNow()}else if(field==='descansoInicio'){if(!r.entrada||r.salida||r.descansoInicio||r.descansoFin)return;r.descansoInicio=smeNow()}else if(field==='descansoFin'){if(!r.descansoInicio||r.descansoFin||r.salida)return;r.descansoFin=smeNow()}else if(field==='salida'){if(!r.entrada||r.salida||r.descansoInicio&&!r.descansoFin)return;r.salida=smeNow()}r.actualizadoPor=String(u.id);if(!(await save())){db=JSON.parse(before);return}attendancePage()};

function smeInferLaborTimeVehicleGroup(item){
 if(SME_LABOR_TIME_GROUP_OVERRIDES[item.id])return SME_LABOR_TIME_GROUP_OVERRIDES[item.id];
 const txt=normalizeSearch([item.title,item.application,item.keywords].join(' '));
 if(/pickup.*4x4|4x4.*pickup|transferencia reductora/.test(txt))return 'Pickup 4×4';
 if(/pickup.*4x2|4x2.*pickup|dos ruedas motrices/.test(txt))return 'Pickup 4×2';
 if(/utilitario|furgon|kangoo|berlingo|partner|doblo|furgoneta/.test(txt))return 'Utilitario liviano';
 if(/diesel|tdci|hdi|tdi|jtd|gasoil/.test(txt))return 'Diésel · aplicación general';
 if(/8v|8 valvulas/.test(txt))return 'Naftero 8v · grupo general';
 if(/16v|16 valvulas|k4m|tu5|sigma/.test(txt))return 'Naftero 16v · grupo general';
 if(/sedan|sedan manual|auto compacto|traccion delantera/.test(txt))return 'Auto/sedán · aplicación general';
 return 'Auto/pickup liviana · grupo general';
}
function smeLaborTimeMetadata(item){
 const links=Array.isArray(item.sourceLinks)?item.sourceLinks:[];
 const first=links.find(link=>link&&link.url)||null;
 let sourceName=item.sourceName||'';
 if(!sourceName&&first){
  const url=String(first.url).toLowerCase();
  sourceName=url.includes('openlaborproject.com')?'Open Labor Project · base comparativa'
   :url.includes('scribd.com')?(String(item.id).includes('k4m')?'Ficha técnica ContiTech · documento compartido':'Documento técnico público compartido')
   :'Referencia externa enlazada';
 }
 if(!sourceName)sourceName=item.suggested===null?'Sin fuente de horas confirmada':'Estimación interna de SME';
 let confidence=item.confidence||'';
 let confidenceDetail=item.confidenceDetail||'';
 if(!confidence){
  if(item.status==='Referencia técnica específica'){
   confidence='Media · ficha técnica específica';
   confidenceDetail='Dato puntual para la aplicación citada. Confirmar el motor, año y alcance antes de presupuestar.';
  }else if(item.status==='Comparativo externo'){
   confidence='Media-baja · comparativo externo';
   confidenceDetail='El dato procede de una base externa; puede no estar verificado con información OEM ni corresponder al parque argentino.';
  }else if(String(item.status||'').includes('Promedio agrupado')){
   confidence='Orientativa · promedio agrupado SME';
   confidenceDetail='Promedio de planificación para una familia de trabajos/vehículos; ajustar según acceso, estado y alcance real.';
  }else if(String(item.status||'').includes('Promedio genérico')||item.status==='Orientativo'){
   confidence='Baja · promedio genérico';
   confidenceDetail='Referencia amplia de SME que requiere juicio del taller.';
  }else if(item.suggested===null){
   confidence='Pendiente';
   confidenceDetail='No se recomienda usar horas para calcular este trabajo hasta incorporar una referencia suficiente.';
  }else{
   confidence='Orientativa';
   confidenceDetail='Verificar la aplicación y el alcance del trabajo real.';
  }
 }
 return Object.assign(item,{
  vehicleGroup:item.vehicleGroup||smeInferLaborTimeVehicleGroup(item),
  variants:item.variants||item.application||'Aplicación por confirmar',
  sourceName,
  sourceUrl:item.sourceUrl||(first?first.url:''),
  sourceType:item.sourceType||(first?(String(first.url).includes('openlaborproject.com')?'Comparativo externo':String(first.url).includes('scribd.com')?'Ficha/documento técnico público':'Referencia externa'):(item.suggested===null?'Pendiente':'Estimación interna SME')),
  publishedHours:Number.isFinite(item.publishedHours)?item.publishedHours:null,
  confidence,
  confidenceDetail
 });
}

function smeLaborTimeSearchText(item){return normalizeSearch([item.title,item.family,item.application,item.variants,item.vehicleGroup,item.sourceName,item.confidence,item.scope,item.keywords].join(' '))}
function smeLaborHoursLabel(value){if(value===null||value===undefined||value==='')return '—';return Number(value).toLocaleString('es-AR',{maximumFractionDigits:2})+' h'}
function smeLaborTimeRange(item){if(item.suggested===null)return 'Sin tiempo confirmado';if(Number.isFinite(item.publishedHours))return 'Tiempo publicado: '+smeLaborHoursLabel(item.publishedHours);return 'Mín. '+smeLaborHoursLabel(item.min)+' · sugerido '+smeLaborHoursLabel(item.suggested)+' · máx. '+smeLaborHoursLabel(item.max)}
function smeLaborTimeCardMarkup(item,actionLabel,actionAttr){
 const statusClass=item.suggested===null?'sme-time-pending':'sme-time-orientative';
 const publishedHours=Number.isFinite(item.publishedHours)?smeLaborHoursLabel(item.publishedHours):'No hay una hora única publicada para este promedio';

 const metadata='<div class="sme-time-metadata"><p><strong>Grupo:</strong> '+esc(item.vehicleGroup)+' · <strong>Confianza:</strong> '+esc(item.confidence)+'</p><p><strong>Aplicación/variantes:</strong> '+esc(item.variants)+'</p><p><strong>Fuente principal:</strong> '+esc(item.sourceName)+'</p><p><strong>Horas publicadas:</strong> '+esc(publishedHours)+'</p><p class="muted">'+esc(item.confidenceDetail)+'</p></div>';
 return '<article class="item sme-time-detail-card"><div class="sme-time-card-head"><strong>'+esc(item.title)+'</strong><span class="'+statusClass+'">'+esc(item.status)+'</span></div><p class="muted">'+esc(item.family)+' · '+esc(item.vehicleGroup)+'</p><p class="sme-time-range">'+esc(smeLaborTimeRange(item))+'</p>'+metadata+'<p>'+esc(item.scope)+'</p>'+sourceNote+sourceLinks+(actionAttr?'<div class="quick"><button type="button" class="secondary" '+actionAttr+'="'+esc(item.id)+'">'+esc(actionLabel)+'</button></div>':'')+'</article>';
}
function smeLaborTimeCompactRowMarkup(item,selected,actionAttribute){

function smeInitQuickLaborEstimate(form){
 const search=document.getElementById('smeQuickLaborSearch'),results=document.getElementById('smeQuickLaborResults'),selectedBox=document.getElementById('smeQuickLaborSelected'),calc=document.getElementById('smeQuickLaborCalc'),minHoursInput=document.getElementById('smeQuickLaborMinHours'),hoursInput=document.getElementById('smeQuickLaborHours'),maxHoursInput=document.getElementById('smeQuickLaborMaxHours'),rateInput=document.getElementById('smeQuickLaborRate'),costMinInput=document.getElementById('smeQuickCostMin'),costMaxInput=document.getElementById('smeQuickCostMax'),preview=document.getElementById('smeQuickLaborPreview'),applyButton=document.getElementById('smeQuickApplyLaborEstimate'),minField=form.elements.estimacionMinima,maxField=form.elements.estimacionMaxima,scopeField=form.elements.alcanceOrientativo;
 if(!search||!results||!selectedBox||!calc||!minHoursInput||!hoursInput||!maxHoursInput||!rateInput||!costMinInput||!costMaxInput||!preview||!applyButton||!minField||!maxField)return;
 let selected=null;
 const numberHours=input=>Number(String(input?.value??'').trim().replace(',','.'));
 const moneyValue=input=>String(input?.value??'').trim()?parseMoneyInput(input.value):0;
 const paint=()=>{
  const minHours=numberHours(minHoursInput),hours=numberHours(hoursInput),maxHours=numberHours(maxHoursInput),rate=moneyValue(rateInput),otherMin=moneyValue(costMinInput),otherMax=moneyValue(costMaxInput);
  const valid=!!selected&&selected.suggested!==null&&Number.isFinite(minHours)&&minHours>0&&Number.isFinite(hours)&&hours>0&&Number.isFinite(maxHours)&&maxHours>=minHours&&hours>=minHours&&hours<=maxHours&&Number.isFinite(rate)&&rate>0&&Number.isFinite(otherMin)&&otherMin>=0&&Number.isFinite(otherMax)&&otherMax>=otherMin;

function diagnosticState(id,value){

 const bad=/(fallan|falla|fallo|contaminad|oscuro|desgastad|agrietad|importante|reemplazar|requiere cambio|error|oxido|perforad|sucio|fuga|bajo|alto|no funciona|no arranca|no mantiene|inestable|irregular|floja|rotas|mal estado|excesiva|danad|obstruid|blanco persistente|azul|negro|con juego|sulfatada|descargada|ajustar|verificar conexion|dificultoso|faltante|faltantes|agrietadas|no carga|leve|muy sucio|no tiene auxilio|necesita diagnostico|registro de errores|codigos detectados|codigo detectado)/i;

function diagnosticPriority(item){

function diagnosticFlags(record){

function recordTitle(key,o){
 if(key==='recepciones')return 'Ingreso · '+(o.fecha||'')+' · '+vehicleName(o.vehiculoId);
 if(key==='diagnosticos')return 'Diagnóstico · '+(o.fecha||'')+' · '+vehicleName(o.vehiculoId);
 if(key==='clientes')return o.nombre||'Cliente';
 if(key==='vehiculos')return [o.patente,o.marca,o.modelo].filter(Boolean).join(' · ')||'Vehículo';
 if(key==='trabajos')return (o.numero||'Orden')+' · '+vehicleName(o.vehiculoId);
 if(key==='presupuestos')return (o.tipo==='Orientativo'?'Consulta orientativa':'Presupuesto')+' · '+(o.fecha||'')+' · '+(o.vehiculoReferencia||customerName(o.clienteId));
 if(key==='movimientos')return o.tipo+' · $ '+money(o.importe);
 return o.titulo||o.concepto||'Registro';
}
let printWatermarkData='';
async function getPrintWatermark(){
 if(printWatermarkData)return printWatermarkData;
 try{
  const response=await fetch('./logo-watermark.svg');
  if(!response.ok)throw new Error('No se pudo cargar el sello de agua.');
  const svg=(await response.text()).replace('opacity="0.09"','opacity="0.09"');
  printWatermarkData='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  return printWatermarkData;
 }catch(error){
  console.warn('No se pudo incrustar el sello de agua para impresión:',error);
  return './logo-watermark.svg';
 }
}

app.addEventListener('click',async e=>{
 const button=e.target.closest('#restoreDatabaseBtn');
 if(!button)return;
 e.preventDefault();e.stopPropagation();
 if(!storage?.isNative){alert('La restauración de SQLite completa solo está disponible en la aplicación Android.');return}
 button.disabled=true;
 let selected=null,storageClosed=false;
 try{
  selected=await SmeBackup.pickAndValidateRestore();
  if(!selected||selected.cancelled)return;
  const sizeMB=(Number(selected.sizeBytes||0)/1048576).toLocaleString('es-AR',{maximumFractionDigits:1});
  const message='RESUMEN ANTES DE RESTAURAR\n\nCopia seleccionada: '+String(selected.filename||'SME-copia-completa.db')+'\nClientes: '+selected.clientCount+'\nVehículos: '+selected.vehicleCount+'\nTrabajos: '+selected.workCount+'\nAdjuntos verificados: '+selected.attachmentCount+'\nTamaño: '+sizeMB+' MB\n\nQUÉ VA A PASAR\nSME cerrará la base actual, guardará una copia interna de seguridad y reemplazará la base por el archivo seleccionado. Después comprobará la base instalada. Durante el proceso puede pedirte ingresar nuevamente. No cierres la aplicación ni retires el archivo.\n\nSi algo falla, SME intentará conservar o recuperar la base anterior. ¿Autorizás iniciar este proceso?';
  if(!await smeStyledConfirm('Confirmar restauración completa',message)){
   await SmeBackup.discardRestore({token:selected.token});
   selected=null;
   return;
  }
  if(!smeCurrentUser||smeCurrentUser.isPrimary!==true){
   await smeShowMessage('Restauración no autorizada','Solo el administrador principal puede restaurar una copia SQLite completa. No se modificó la base actual.','error');
   await SmeBackup.discardRestore({token:selected.token});selected=null;return;
  }
  const enteredPassword=await smeAskPassword('Autorizar restauración','Ingresá la contraseña del administrador principal para autorizar el reemplazo de la base de datos.');
  if(enteredPassword===null){
   await SmeBackup.discardRestore({token:selected.token});selected=null;return;
  }
  const enteredHash=await smeHashPassword(enteredPassword,smeCurrentUser.salt);
  if(enteredHash!==smeCurrentUser.hash){
   await smeShowMessage('Restauración cancelada','La contraseña no es correcta. No se modificó la base de datos actual.','error');
   await SmeBackup.discardRestore({token:selected.token});selected=null;return;
  }
  await smeShowMessage('Autorización confirmada','La contraseña fue validada. SME comenzará ahora la restauración y te mostrará el resultado final.','info');
  await storage.close();
  storageClosed=true;
  const restoreResult=await SmeBackup.commitRestore({token:selected.token});
  selected=null;
  const report='RESULTADO: RESTAURACIÓN COMPLETADA\n\nLa base instalada superó la validación final de SQLite.\n\nRegistros en la copia restaurada:\n• Clientes: '+Number(restoreResult.clientCount??0)+'\n• Vehículos: '+Number(restoreResult.vehicleCount??0)+'\n• Trabajos: '+Number(restoreResult.workCount??0)+'\n• Adjuntos verificados: '+Number(restoreResult.attachmentCount??0)+'\n\nCopia interna previa: '+(restoreResult.safetyCopyKept?'conservada':'no confirmada')+'\nValidación final: aprobada\n\nSME volverá a abrirse para cargar los datos restaurados.';
  await smeShowMessage('Informe de restauración',report,'success');
  location.reload();
 }catch(error){
  console.error('No se pudo restaurar la base SQLite:',error);
  if(selected?.token){try{await SmeBackup.discardRestore({token:selected.token})}catch(_){}}
  const detail=String(error?.message||error);
  const report='RESULTADO: RESTAURACIÓN NO COMPLETADA\n\nSME no confirmó una restauración exitosa. La operación se detuvo o falló durante el proceso.\n\nDetalle técnico: '+detail+'\n\nLa aplicación intentará volver a abrir la base disponible. Al ingresar, verificá clientes, vehículos y trabajos antes de continuar. Conservá el archivo original y no repitas la restauración hasta revisar el resultado.';
  await smeShowMessage('Informe de restauración',report,'error');
  if(storageClosed)location.reload();
 }finally{
  button.disabled=false;
 }
});

function smeHashPassword(password,salt){
 const enc=new TextEncoder();
 return crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']).then(key=>crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:210000,hash:'SHA-256'},key,256)).then(bits=>Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join(''));
}
function smeNewSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
function smeModuleKey(value){return ({movimientos:'caja',eventos:'agenda'})[value]||value}

const SME_FAATRA_REFERENCE_KEY='sme_faatra_hourly_reference_v1';
const SME_FAATRA_SOURCE_URL='https://www.faatra.org.ar/servicios/costo-hora/';
// Respaldo con el último valor oficial conocido; es histórico y nunca se presenta como vigente.
const SME_FAATRA_FALLBACK=Object.freeze({value:84000,period:'Julio, agosto y septiembre de 2026',sourceUrl:SME_FAATRA_SOURCE_URL,checkedAt:'',fallback:true});
function smeReadFaatraState(){
 try{const raw=localStorage.getItem(SME_FAATRA_REFERENCE_KEY);const value=raw?JSON.parse(raw):null;return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}
 catch(error){console.warn('No se pudo leer el estado de la referencia FAATRA:',error);return {}}
}
function smeStoreFaatraState(state){
 try{localStorage.setItem(SME_FAATRA_REFERENCE_KEY,JSON.stringify(state));return true}
 catch(error){console.warn('No se pudo guardar el estado de la referencia FAATRA:',error);return false}
}
function smeCanSeeFaatraReference(){
 if(!smeAuthenticated||!smeCurrentUser)return false;
 if(smeCurrentUser.isPrimary===true)return true;
 const level=smeCurrentUser.permissions&&smeCurrentUser.permissions.horaTallerFaatra;
 return level==='view'||level==='edit';
}
function smeFaatraPermissionOptions(selected){
 return [['none','Sin acceso'],['view','Puede consultar']].map(([value,label])=>'<option value="'+value+'" '+(selected===value?'selected':'')+'>'+label+'</option>').join('');
}
function smeFaatraMoney(value){
 const amount=Number(value);
 return Number.isFinite(amount)?new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(amount):'Sin dato';
}
function smeFaatraDateLabel(value){
 if(!value)return 'Sin comprobar';
 const date=new Date(value);
 return Number.isNaN(date.getTime())?'Sin comprobar':date.toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});
}
function smeFaatraPeriodExpiry(period){
 const clean=String(period||'').trim().replace(/[.,;:]+$/,'');
 const match=clean.match(/(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+de)?\s+(20\d{2})$/i);
 if(!match)return null;
 const months={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
 const month=months[match[1].toLocaleLowerCase('es-AR')],year=Number(match[2]),now=new Date();
 return year<now.getFullYear()||(year===now.getFullYear()&&month<now.getMonth());
}
function smeFaatraReferenceCardMarkup(){
 if(!smeCanSeeFaatraReference())return '';
 const state=smeReadFaatraState(),savedCurrent=state.current&&typeof state.current==='object'?state.current:null;
 const usingFallback=!savedCurrent,current=savedCurrent||SME_FAATRA_FALLBACK;
 const expired=smeFaatraPeriodExpiry(current.period);
 const valueMarkup='<div class="sme-faatra-rate"><span>'+(usingFallback?'Último valor oficial conocido · histórico':'Último valor publicado por FAATRA')+'</span><strong>$ '+smeFaatraMoney(current.value)+' + IVA</strong><small>por hora de taller</small></div>';
 const periodMarkup=usingFallback
  ?'<p class="muted">Período publicado: <strong>'+esc(current.period)+'</strong>. No hay una comprobación correcta guardada en este dispositivo.</p>'
  :'<p class="muted">Período publicado: <strong>'+esc(current.period||'No identificado')+'</strong> · Última comprobación correcta: '+esc(smeFaatraDateLabel(current.checkedAt))+'</p>';
 const expiryMarkup=expired===true
  ?'<p class="sme-faatra-warning" role="status">'+(usingFallback?'Este período histórico ya venció. El valor de $ 84.000 + IVA corresponde a julio-septiembre de 2026 y no debe interpretarse como tarifa vigente.':'Atención: el período publicado ya venció. FAATRA todavía no muestra un período posterior en esta consulta; confirmá su vigencia antes de tomarlo como referencia actual.')+'</p>'
  :!current.period
   ?'<p class="sme-faatra-warning" role="status">No se pudo identificar el período de vigencia; verificá la publicación original antes de usar este dato.</p>':'';
 const errorMarkup=state.lastError
  ?'<p class="muted" role="status">'+(usingFallback?'No se pudo consultar FAATRA en el último intento. Se mantiene este valor histórico de respaldo; no se presenta como actualizado.':'No se pudo comprobar FAATRA en el último intento. Se conserva el dato anterior sin marcarlo como actualizado.')+'</p>'
  :usingFallback?'<p class="muted" role="status">Al conectarse, SME intentará comprobar si FAATRA publicó un período nuevo.</p>':'';
 return '<section class="panel sme-faatra-reference" id="smeFaatraReferenceCard"><div class="sme-faatra-heading"><div><h3>Referencia de hora taller · FAATRA</h3><p class="muted">Consulta orientativa para el personal autorizado.</p></div><span class="sme-faatra-source-tag">FUENTE EXTERNA</span></div>'+
  valueMarkup+periodMarkup+expiryMarkup+errorMarkup+
  '<p class="muted sme-faatra-disclaimer">Este dato no modifica ninguna tarifa, presupuesto ni cálculo de SME. El precio del taller lo decide únicamente la persona autorizada por el taller.</p>'+
  '<div class="quick"><button type="button" class="secondary" id="smeRefreshFaatraReference">Comprobar ahora</button><a href="'+SME_FAATRA_SOURCE_URL+'" target="_blank" rel="noopener noreferrer">Ver publicación oficial de FAATRA</a></div></section>';
}

 const before=notice.before||{},after=notice.after||state.current||{};
 const message='FAATRA informó un cambio en su referencia de hora taller. Antes: $ '+smeFaatraMoney(before.value)+' + IVA ('+(before.period||'período anterior')+'). Ahora: $ '+smeFaatraMoney(after.value)+' + IVA ('+(after.period||'período publicado no identificado')+'). No se cambió ningún precio de SME.';

function smeRecommendedPermissions(area,jobTitle){
 const p=Object.fromEntries(SME_MODULES.map(m=>[m.key,'none']));
 const set=(keys,level='view')=>keys.forEach(k=>p[k]=level);
 const job=normalizeSearch(jobTitle||''),a=String(area||'');
 const isMechanic=/^mecanico$|^ayudante de mecanica$/.test(job);
 const isWorkshopLead=/responsable de taller|encargado de taller|supervisor de taller/.test(job);
 const isReception=a==='Recepción de clientes'||/^recepcion$/.test(job);
 const isAdminArea=a==='Área Administrativa'||/administrativ|secretar/.test(job);
 const isCleaning=a==='Área de Limpieza y Mantenimiento'||/limpieza|mantenimiento/.test(job);
 const isLeadership=a==='Dirección y Supervisión'&&/gerente|supervisor|encargado|administrador principal/.test(job);
 // Mecánicos trabajan sobre vehículos y órdenes ya asignadas. No necesitan
 // el padrón de clientes, presupuestos, agenda ni permiso para crear órdenes.
 if(a==='Área de Mecánica'||isMechanic||isWorkshopLead){
  set(['vehiculos','trabajos'],'view');
  set(['tiempos'],'view');
  set(['diagnosticos','avisos','asistencias'],'edit');
  set(['tareas'],'view');
  if(isWorkshopLead){
   set(['clientes','vehiculos','trabajos','presupuestos','agenda','recepciones','diagnosticos','asistencias','terceros','tareas','avisos','gastos'],'edit');
   set(['tiempos'],'view');
   set(['caja','cuentas'],'none');
  }
  return p;
 }
 // Recepción: gestiona atención, agenda, datos de clientes y presupuestos,
 // pero no administra tareas, personal, caja ni configuración del taller.
 if(isReception){
  set(['clientes','vehiculos','agenda','presupuestos','recepciones','avisos'],'edit');
  set(['tiempos'],'view');
  set(['trabajos','tareas','asistencias'],'view');
  return p;
 }
 // Administración: acceso operativo/administrativo necesario; los módulos
 // financieros quedan reservados al responsable administrativo.
 if(isAdminArea){
  set(['clientes','vehiculos','presupuestos','agenda','recepciones','terceros','avisos'],'edit');
  set(['tiempos'],'view');
  set(['trabajos','tareas','asistencias','diagnosticos'],'view');
  if(/responsable administrativo/.test(job))set(['caja','cuentas','gastos'],'edit');
  return p;
 }
 // Limpieza y mantenimiento: registra avisos y su propia jornada; consulta
 // tareas asignadas, sin acceder a clientes, presupuestos ni órdenes.
 if(isCleaning){
  set(['tareas'],'view');
  set(['avisos','asistencias'],'edit');
  return p;
 }
 // Dirección y supervisión puede coordinar el taller. La caja y cuentas
 // corrientes no se conceden automáticamente a todos los supervisores.
 if(a==='Dirección y Supervisión'||isLeadership){
  set(['clientes','vehiculos','trabajos','presupuestos','agenda','recepciones','diagnosticos','asistencias','terceros','tareas','avisos','gastos'],'edit');
  set(['tiempos'],'view');
  if(/gerente|encargado|administrador principal/.test(job))set(['caja','cuentas'],'edit');
  return p;
 }
 // Perfiles nuevos o no reconocidos comienzan sin acceso. El administrador
 // principal puede conceder únicamente los permisos que correspondan.
 return p;
}

 form.addEventListener('submit',async ev=>{

  if(lastName.length<2){smeFormError(form,'Ingresá un apellido válido.','lastName');return}
  if(name.length>80){smeFormError(form,'El nombre y apellido juntos no pueden superar 80 caracteres.','lastName');return}
  if(!/^\d{7,8}$/.test(dni)){smeFormError(form,'Ingresá un DNI válido de 7 u 8 números.','dni');return}
  if(phoneDigits.length<10||phoneDigits.length>15){smeFormError(form,'Ingresá un celular con código de área y entre 10 y 15 números.','phone');return}
  if(!SME_AREAS.some(a=>a.value===area)){smeFormError(form,'Elegí el área de trabajo.','area');return}
  if(!jobTitle||jobTitle.length>50){smeFormError(form,'Elegí un puesto e indicá cuál si seleccionaste Otro puesto.','jobTitle');return}
  if(selectedJob==='__custom__'&&!jobCustom){smeFormError(form,'Escribí el puesto personalizado.','jobCustom');return}
  if(selectedJob!=='__custom__'&&!isPrimary&&!(SME_JOBS_BY_AREA[area]||[]).includes(jobTitle)){smeFormError(form,'Elegí un puesto correspondiente al área seleccionada.','jobTitle');return}
  if(photoFile&&photoFile.size>12*1024*1024){alert('La foto supera 12 MB. Elegí una imagen más pequeña.');return}
  if((!editing||password)&&password.length<10){smeFormError(form,'La contraseña debe tener al menos 10 caracteres.','password');return}
  if((!editing||password)&&password!==password2){smeFormError(form,'Las contraseñas no coinciden.','password2');return}
  if(smeUsers.some(u=>u.username===username&&String(u.id)!==String(editing&&editing.id))){smeFormError(form,'Ya existe un usuario con ese nombre.','username');return}
  const permissions=isPrimary?Object.fromEntries(SME_MODULES.map(m=>[m.key,'edit'])):Object.fromEntries(SME_MODULES.map(m=>[m.key,form.elements['perm_'+m.key]?.value||'none']));
  permissions.backup=isPrimary?'edit':(form.elements.perm_backup?.value||'none');
  permissions.presupuestosCostos=isPrimary?'edit':(form.elements.perm_presupuestosCostos?.value||'none');
  permissions.horaTallerFaatra=isPrimary?'view':(form.elements.perm_horaTallerFaatra?.value||'none');

  const next={...(editing||{}),id:editing?editing.id:'sme-user-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),username,firstName,lastName,name,dni,phone,area,jobTitle,jobCustom:selectedJob==='__custom__'?jobCustom:'',profilePhoto,role:isPrimary?'admin':'usuario',isPrimary,active:isPrimary?true:!!form.elements.active?.checked,permissions,updatedAt:new Date().toISOString()};
  if(!editing)next.createdAt=next.updatedAt;
  if(password){next.salt=smeNewSalt();next.hash=await smeHashPassword(password,next.salt);next.iterations=210000}
  if(!next.salt||!next.hash){smeFormError(form,'No se guardó la cuenta porque faltan credenciales válidas.','password');return}
  if(!await smeUserPreviewDialog(next,'save'))return;
  const nextUsers=editing?smeUsers.map(u=>String(u.id)===String(editing.id)?next:u):[...smeUsers,next];

   try{scroller.scrollBy({top:delta,behavior:'auto'})}catch(_){window.scrollBy(0,delta)}
  }
  // Segundo ajuste tras el desplazamiento, por si el teclado termina de animarse.
  requestAnimationFrame(()=>{
   if(document.activeElement!==active)return;
   const rr=active.getBoundingClientRect();
   const bottom=(vv?vv.offsetTop+vv.height:window.innerHeight);
   const navNow=document.querySelector('nav');
   const navH=navNow&&!navNow.hidden?navNow.getBoundingClientRect().height:0;
   const limit=Math.min(bottom,window.innerHeight-navH)-28;
   if(rr.bottom>limit){
    const d=rr.bottom-limit;
    const scroller=active.closest('main')||document.scrollingElement||document.documentElement;
    try{scroller.scrollBy({top:d,behavior:'auto'})}catch(_){window.scrollBy(0,d)}
   }
  });
 };
 const adjust=(force=false)=>{
  forceNext=forceNext||!!force;
  if(scheduled)return;scheduled=true;
  requestAnimationFrame(()=>{
   scheduled=false;
   const forceNow=forceNext;forceNext=false;
   const active=document.activeElement;
   const editable=isEditable(active);
   const keyboardOpen=keyboardLikely(active)||!!(vv&&(window.innerHeight-vv.height>100||vv.height<window.innerHeight*.85));
   document.body.classList.toggle('sme-keyboard-open',keyboardOpen);
   if(editable&&(keyboardOpen||forceNow))keepFieldVisible(active);
  });
 };
 document.addEventListener('focusin',e=>{
  if(!isEditable(e.target))return;
  const token=++focusToken;
  // En Android WebView el visualViewport no siempre cambia al abrir el teclado.
  // Activar el modo teclado desde el foco y ajustar el campo en varios momentos.
  if(keyboardLikely(e.target))document.body.classList.add('sme-keyboard-open');
  [0,80,160,280,420,600].forEach(delay=>setTimeout(()=>{
   if(token===focusToken)adjust(true);
  },delay));
 });
 document.addEventListener('focusout',()=>{
  const token=++focusToken;
  setTimeout(()=>{
   if(token!==focusToken)return;
   const active=document.activeElement;
   if(!isEditable(active))document.body.classList.remove('sme-keyboard-open');
   else adjust(true);
  },120);
 });
 vv?.addEventListener('resize',()=>adjust(true));vv?.addEventListener('scroll',()=>adjust(true));
 window.addEventListener('resize',()=>adjust(true));
 window.addEventListener('orientationchange',()=>setTimeout(()=>adjust(true),250));
})();
function requireLocalAdmin(){
 try{
  const stored=JSON.parse(localStorage.getItem(SME_USERS_KEY)||'[]');
  smeUsers=Array.isArray(stored)?stored.filter(u=>u&&typeof u==='object'&&u.username&&u.salt&&u.hash):[];
 }catch(error){console.error('No se pudieron leer los usuarios SME:',error);smeUsers=[]}
 if(!globalThis.crypto?.subtle){smeAuthScreen('setup','Este dispositivo no ofrece la función criptográfica necesaria. No se guardaron credenciales.');return}
 const hasPrimary=smeUsers.some(u=>u.isPrimary===true||u.role==='admin'||u.role==='owner'||u.role==='propietario');
 const hasAnySavedAccount=smeUsers.length>0;
 let mode=hasPrimary?'login':(hasAnySavedAccount||localStorage.getItem(SME_AUTH_KEY)?'migrate':'setup');
 if(mode==='login'&&!smeForcePasswordForNextLogin){
  const lastAccount=localStorage.getItem(SME_LAST_ACCOUNT_KEY);
  const lastUser=smeUsers.find(u=>u.username===lastAccount&&u.active!==false);
  if(lastUser)smeSelectedLoginUsername=lastUser.username;
 }
 smeAuthScreen(mode, '', !!smeSelectedLoginUsername && !smeForcePasswordForNextLogin);
 let smeBackgroundLockTimer=null;
 const SME_BACKGROUND_GRACE_MS=2500;
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&smeAuthenticated){
   // No bloquear por un toque accidental en Aplicaciones recientes: dar 10 segundos para volver.
   if(smeFilePickerPending)return;
   if(smeBackgroundLockTimer!==null)clearTimeout(smeBackgroundLockTimer);
   smeBackgroundLockTimer=setTimeout(()=>{
    smeBackgroundLockTimer=null;
    if(document.visibilityState==='hidden'&&smeAuthenticated&&!smeFilePickerPending)
     smeLockSession('La sesión se bloqueó después de permanecer fuera de SME.');
   },SME_BACKGROUND_GRACE_MS);
   return;
  }
  if(document.visibilityState==='visible'){
   // Si volvió antes de los 10 segundos, cancelar el bloqueo y continuar donde estaba.
   if(smeBackgroundLockTimer!==null){clearTimeout(smeBackgroundLockTimer);smeBackgroundLockTimer=null;if(smeAuthenticated)smeResetIdleTimer()}
   if(document.visibilityState==='visible'&&smeAuthenticated&&smeFilePickerPending)
    setTimeout(()=>{if(document.visibilityState==='visible'&&smeFilePickerPending)smeFinishFilePicker()},250);
  }
 });
}
if(Capacitor.isNativePlatform()){
 CapacitorApp.addListener('backButton',()=>{void smeHandleHardwareBack()}).catch(error=>{
  console.error('No se pudo activar la navegación del botón Atrás:',error);
 });
}

document.addEventListener('click',event=>{
 const refresh=event.target.closest('#smeRefreshFaatraReference');
 if(refresh){
  event.preventDefault();
  if(!smeCanSeeFaatraReference()){alert('Tu usuario no tiene permiso para consultar esta referencia.');return}
  if(refresh.disabled)return;
  refresh.disabled=true;refresh.textContent='Consultando FAATRA…';
  void smeCheckFaatraReference(true);
  return;
 }
 const ack=event.target.closest('[data-faatra-ack]');
 if(ack){
  if(!smeCanSeeFaatraReference())return;
  const state=smeReadFaatraState(),notice=state.notification;
  if(!notice)return;
  const userId=String(smeCurrentUser.id);
  notice.acknowledgedBy=Array.from(new Set([...(Array.isArray(notice.acknowledgedBy)?notice.acknowledgedBy:[]),userId]));
  state.notification=notice;smeStoreFaatraState(state);smeRenderFaatraUpdateNotice();return;
 }
 const open=event.target.closest('[data-faatra-open]');
 if(open){
  event.preventDefault();
  if(!smeCanSeeFaatraReference()){alert('Tu usuario no tiene permiso para consultar esta referencia.');return}
  smeNavigateTo('gestion');
 }
});
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&smeAuthenticated&&smeCanSeeFaatraReference()){
  smeRenderFaatraUpdateNotice();
  void smeCheckFaatraReference();
 }
});

requireLocalAdmin();
